# Firebase App Hosting runtime config — see scripts/deploy at the repo root.
#
# The backend's root directory is the repo root (not apps/web) because the
# npm workspace lockfile lives here and apps/web depends on the
# @random-knowledge/shared workspace package.
scripts:
  # See scripts/apphosting-build for why this is a script.
  buildCommand: bash scripts/apphosting-build
  runCommand: npm --prefix apps/web run start
#
# NEXT_PUBLIC_* values are safe to commit (see .env.local.example) and must
# be present at BUILD time since Next.js inlines them into the client
# bundle. FIREBASE_SERVICE_ACCOUNT_KEY is intentionally absent: App Hosting
# runs on Firebase's own infrastructure, so src/lib/firebase-admin.ts's
# Application Default Credentials fallback covers it with no key needed.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyD5d1SqbgYISeAdD84Bi-R4B_o9Qp1LO0M"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "kindling-505ce.firebaseapp.com"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "kindling-505ce"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "kindling-505ce.firebasestorage.app"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "660038712756"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:660038712756:web:a91642ef178e77f16606e1"
    availability: [ BUILD, RUNTIME ]
  - variable: OPENAI_MODEL
    value: "gpt-4o-mini"
    availability: [ RUNTIME ]
  - variable: OPENAI_RESEARCH_MODEL
    value: "gpt-4.1"
    availability: [ RUNTIME ]
  - variable: OPENAI_API_KEY
    secret: openai-api-key
  - variable: CRON_SECRET
    secret: cron-secret
  # Discover (the articles feed in Explore): the articles app's Turso database and the scraper used to read an article.
  - variable: TURSO_DATABASE_URL
    secret: turso-database-url
  - variable: TURSO_AUTH_TOKEN
    secret: turso-auth-token
  - variable: SCRAPER_API_KEY
    secret: scraper-api-key
